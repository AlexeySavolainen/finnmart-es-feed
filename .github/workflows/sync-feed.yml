name: Sync Finnmart Spain and Finland feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: finnmart-product-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest -v test_sync_feed.py test_sync_fi_pilot.py test_sync_fi_full.py
      - name: Synchronize the Shopify Spain Market catalog
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_feed.py
      - name: Build the isolated Finland 100-product pilot
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_fi_pilot.py
      - name: Build the complete Finland production candidate
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_fi_full.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
