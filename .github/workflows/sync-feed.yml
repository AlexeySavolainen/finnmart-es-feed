name: Sync Finnmart Spain, Ireland, France, Portugal, Italy and Finland feeds

on:
  workflow_dispatch:
    inputs:
      preserve_finland_run:
        description: Successful feed run whose Finnish XML and reports must remain unchanged
        required: false
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: finnmart-product-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: python -m unittest -v test_sync_feed.py test_sync_fi_pilot.py test_sync_fi_full.py
      - name: Synchronize the Shopify Spain Market catalog
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_feed.py
      - name: Synchronize the Shopify Ireland Market catalog in English
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_feed.py --target IE
      - name: Synchronize the Shopify France Market catalog in French
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_feed.py --target FR
      - name: Synchronize the Shopify Portugal Market catalog in Portuguese
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_feed.py --target PT
      - name: Synchronize the Shopify Italy Market catalog in Italian
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_feed.py --target IT
      - name: Build the isolated Finland 100-product pilot
        if: ${{ !inputs.preserve_finland_run }}
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_fi_pilot.py
      - name: Build the complete Finland production candidate
        if: ${{ !inputs.preserve_finland_run }}
        env:
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: python sync_fi_full.py
      - uses: actions/download-artifact@v4
        if: ${{ inputs.preserve_finland_run != '' }}
        with:
          name: github-pages
          run-id: ${{ inputs.preserve_finland_run }}
          github-token: ${{ github.token }}
          path: previous
      - name: Preserve Finnish feeds byte-for-byte
        if: ${{ inputs.preserve_finland_run != '' }}
        run: |
          mkdir preserved
          tar -xf previous/artifact.tar -C preserved
          for filename in vuodevaatteet-fi-pilot.xml vuodevaatteet-fi-pilot-summary.json vuodevaatteet-fi-production-candidate.xml vuodevaatteet-fi-production-candidate-summary.json; do
            cp "preserved/$filename" "public/$filename"
            cmp "preserved/$filename" "public/$filename"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
